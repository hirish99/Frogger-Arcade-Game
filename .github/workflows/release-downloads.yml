name: Publish Release Downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v1.0.0
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.dist_platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_platform: linux-x64
            javafx_platform: linux
          - os: windows-latest
            dist_platform: win-x64
            javafx_platform: win
          - os: macos-15-intel
            dist_platform: mac-x64
            javafx_platform: mac
          - os: macos-latest
            dist_platform: mac-aarch64
            javafx_platform: mac-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build downloadable bundle
        shell: bash
        env:
          DIST_PLATFORM: ${{ matrix.dist_platform }}
          JAVAFX_PLATFORM: ${{ matrix.javafx_platform }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/package.sh

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.dist_platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-latest

    steps:
      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create \
              "$RELEASE_TAG" \
              release-assets/*.zip \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
